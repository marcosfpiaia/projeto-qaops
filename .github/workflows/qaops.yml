name: Pipeline QAOps

on:
  push:
    branches: [ "main" ]

jobs:
  integracao-continua:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixar o código
      uses: actions/checkout@v4

    - name: 2. Configurar PHP 8.2
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: 3. Instalar dependências (Quality Gate de Build)
      run: composer install --prefer-dist --no-progress

    - name: 4. Análise Estática (Quality Gate de Código)
      run: php -l Calculadora.php

    - name: 5. Testes Automatizados (Quality Gate de Comportamento)
      run: php vendor/bin/phpunit tests/CalculadoraTest.php