<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Login - Qualidade de Software</title>
    <style>
        body {
            font-family: Arial;
            padding: 50px;
            background: #f4f4f4;
        }

        .caixa {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 300px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input,
        button {
            display: block;
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        #mensagem {
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>
    <div class="caixa">
        <h2>Fazer Login</h2>
        <input type="text" id="usuario" placeholder="Digite 'admin'">
        <input type="password" id="senha" placeholder="Digite '1234'">
        <button id="btn-entrar" onclick="fazerLogin()">Entrar no Sistema</button>
        <p id="mensagem"></p>
    </div>

    <script>
        function fazerLogin() {
            const usu = document.getElementById('usuario').value;
            const sen = document.getElementById('senha').value;

            if (usu === 'admin' && sen === '1234') {
                document.getElementById('mensagem').innerText = 'Login com sucesso!';
                document.getElementById('mensagem').style.color = 'green';
            } else {
                document.getElementById('mensagem').innerText = 'Erro no login!';
                document.getElementById('mensagem').style.color = 'red';
            }
        }
    </script>
</body>

</html>
